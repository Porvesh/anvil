name: Live model E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

jobs:
  live-e2e:
    if: github.event_name == 'workflow_dispatch' || github.repository == 'Porvesh/anvil'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BYOK_ENCRYPTION_KEY: ${{ secrets.BYOK_ENCRYPTION_KEY }}
      DATABASE_URL: file:./live-e2e.db
      E2E_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma db push --skip-generate --accept-data-loss
      - run: npm run seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          npm start > /tmp/anvil-next.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:3000/api/problems >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/anvil-next.log
          exit 1
      - run: npm run e2e
