name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: test-key-not-used-by-smoke
      BYOK_ENCRYPTION_KEY: deterministic-ci-only-key-at-least-32-characters
      DATABASE_URL: file:./ci.db
      E2E_BASE_URL: http://127.0.0.1:3000
      CI: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**/*', 'components/**/*', 'lib/**/*', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-
      - run: npm run check
      - run: npx prisma migrate deploy
      - run: npm run seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          npm start > /tmp/anvil-next.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:3000/api/problems >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/anvil-next.log
          exit 1
      - run: npm run e2e:smoke
      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: anvil-next-log
          path: /tmp/anvil-next.log
          if-no-files-found: ignore
