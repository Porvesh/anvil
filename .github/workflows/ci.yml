name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: test-key-not-used-by-smoke
      DATABASE_URL: file:./ci.db
      E2E_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx prisma db push --skip-generate --accept-data-loss
      - run: npm run seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          npm start > /tmp/anvil-next.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:3000/api/problems >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/anvil-next.log
          exit 1
      - run: npm run e2e:smoke
